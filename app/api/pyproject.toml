[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    # AES-256-GCM for TOTP secrets at rest (core/secret_box.py). Declared
    # explicitly rather than relied on as a transitive dependency: this one
    # protects a second factor, so it must not disappear in a lockfile refresh.
    "cryptography>=44.0",
    "faker>=40.43.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "ruff>=0.16.8",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
    "zxcvbn>=4.5.0",
]

[project.optional-dependencies]
# Shared authentication-throttle store for multi-worker deployments.
# AUTH_THROTTLE_BACKEND=redis is rejected at startup unless this is installed:
#   uv sync --extra redis
redis = ["redis>=5.0"]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008", "BLE001", "UP046", "RUF012", "S110", "F841", "SIM102", "RUF059"]

# These fixtures intentionally exercise legacy naive punch timestamps.
[tool.ruff.lint.per-file-ignores]
"tests/test_milestone_2.py" = ["DTZ001"]
"tests/test_milestone_3.py" = ["DTZ001"]
"tests/test_milestone_6.py" = ["DTZ001"]
