<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="people-title-dark people-desc-dark">
  <title id="people-title-dark">People</title>
  <desc id="people-desc-dark">A modern dark-mode People monogram with luminous emerald and mint highlights.</desc>
  <defs>
    <linearGradient id="p-bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121D16"/>
      <stop offset="100%" stop-color="#0D1610"/>
    </linearGradient>
    <linearGradient id="p-door-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF5EE"/>
    </linearGradient>
    <linearGradient id="p-person-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="p-beacon-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Squircle container -->
  <rect width="1024" height="1024" rx="232" fill="url(#p-bg-dark)"/>
  <rect x="12" y="12" width="1000" height="1000" rx="220" fill="none" stroke="#243C2C" stroke-width="12" opacity="0.8"/>
  
  <!-- Doorway / P Monogram -->
  <path d="M312 768c-13.25 0-24-10.75-24-24V274c0-13.25 10.75-24 24-24h236c152 0 264 94 264 242 0 146-112 240-264 240H440v36c0 13.25-10.75 24-24 24h-104zm128-216h108c82 0 132-40 132-104s-50-104-132-104H440v208z" fill="url(#p-door-dark)"/>
  
  <!-- Welcoming Person Figure -->
  <path d="M684 392c0-11 9-20 20-20h12c11 0 20 9 20 20v224c0 38 31 69 69 69h25c12 0 22 10 22 22v37c0 13.25-10.75 24-24 24h-35c-98 0-177-79-177-177V460c0-38 30-68 68-68z" fill="url(#p-person-dark)"/>

  <!-- Radiant Beacon / Head -->
  <circle cx="704" cy="316" r="68" fill="url(#p-beacon-dark)"/>
</svg>