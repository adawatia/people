name: Deploy to UAT (AWS EC2)

on:
  push:
    branches:
      - uat
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'uat'

# Ensure only one deployment runs at a time; cancel queued or superseded builds
concurrency:
  group: ec2-uat-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy People HRMS UAT to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Server Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            /var/www/people/tools/deploy.sh "${{ inputs.branch || github.ref_name }}"
